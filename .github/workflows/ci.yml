name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.13-bookworm
    steps:
      - uses: actions/checkout@v7
      # --frozen fails the job if uv.lock is stale.
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run ty check src tests

  test:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.13-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: uv sync --frozen
      - run: uv run pytest

  # Builds the image publish.yml would push, so a Dockerfile a release would fail on is
  # caught here, then imports the package from the installed wheel.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t manifold-sdk:ci .
      - run: docker run --rm manifold-sdk:ci python -c 'import manifold, PIL'
      - run: docker run --rm manifold-sdk:ci sh -c 'ls /dist/*.whl /dist/requirements.txt'
